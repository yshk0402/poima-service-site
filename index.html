<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ff5a0a">
  <title>ポイマ</title>
  <link rel="icon" href="/assets/app-icon.webp">
  <style>
    html { background: #ff5a0a; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
    .logo { position: relative; width: min(56vw, 280px); aspect-ratio: 3.5; overflow: hidden; }
    .logo img { position: absolute; display: block; width: 169%; max-width: none; height: auto; left: -34%; top: -49%; filter: grayscale(1) invert(1) brightness(3) contrast(2); mix-blend-mode: screen; }
  </style>
</head>
<body>
  <main aria-label="ポイマ">
    <div class="logo"><img src="/assets/logo.webp" alt="ポイマ" width="2172" height="724"></div>
  </main>
</body>
</html>
